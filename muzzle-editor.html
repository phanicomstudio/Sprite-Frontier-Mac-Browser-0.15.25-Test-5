<!doctype html><html><head><meta charset="utf-8"><title>Phanicom muzzle calibration</title><style>
@font-face{font-family:Checkbook;src:url('fonts/CHECKBK0.TTF')}body{background:#080c12;color:#abcfff;font:16px Checkbook,monospace;margin:12px}button,input,select{font:inherit;background:#101827;color:#abcfff;border:1px solid #4d6485;padding:5px;margin:3px}canvas{background:#000;max-width:100%;image-rendering:pixelated;cursor:crosshair;border:1px solid #557}label{display:inline-block}p{margin:8px}#result{color:#ffd28a}textarea{width:95%;height:55px}
</style></head><body><h3>Muzzle and flash calibration</h3>
<label>Profile<select id="profile"></select></label><label>New sprite sheet<input id="sheet" type="file" accept="image/png"></label><br>
<label>Rows<input id="rows" type="number" min="1" max="16" value="8" size="2"></label><label>Columns<input id="columns" type="number" min="1" max="12" value="3"></label><button id="newProfile">Create profile</button><br>
<label>Direction / row<select id="row"></select></label><label>Animation frame<select id="column"></select></label><label>Place<select id="point"><option value="muzzle">Projectile origin</option><option value="flash">Muzzle flash</option></select></label>
<p>Click the barrel tip. Cyan = projectile; orange = flash. Coordinates are stored for each frame. Red arrow previews barrel angle.</p>
<canvas id="preview" width="400" height="600"></canvas><br>
<label>Yaw correction °<input id="yaw" type="number" value="0" min="-180" max="180"></label><label>Pitch correction °<input id="pitch" type="number" value="0" min="-85" max="85"></label><label>Reference sprite height (pixels)<input id="referenceHeight" type="number" value="310" min="1"></label><br>
<button id="copyRow">Copy points to this row's frames</button><button id="apply">Apply to game</button><button id="export">Export calibration JSON</button><label>Import<input id="import" type="file" accept=".json"></label><p id="result"></p>
<script src="src/directions.js"></script><script src="src/candy-image-data.js"></script><script src="src/candy.js"></script><script src="src/muzzle-data.js"></script><script src="src/muzzle.js"></script><script src="src/muzzle-editor.js"></script></body></html>
